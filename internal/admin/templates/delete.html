{{define "crumbs"}}<a class="crumb" href="/forms/{{.Data.ID}}">← {{.Data.Title}}</a>{{end}}
{{define "content"}}
<form method="post" action="/forms/{{.Data.ID}}/delete" class="panel narrow stack">
  <input type="hidden" name="csrf" value="{{.Session.CSRF}}">
  <p>{{thf "Deleting the form <code>%s</code> also deletes <b>all its submissions</b> and its mail queue. This cannot be undone." .Data.ID}}</p>
  <label class="field">{{thf "Type <code>%s</code> to confirm" .Data.ID}}<input name="confirm" autocomplete="off" required></label>
  <div><button class="btn danger">{{t "Delete permanently"}}</button></div>
</form>
{{end}}
