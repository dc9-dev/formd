{{define "content"}}
<form method="post" action="/login" class="stack">
  <label class="field">{{t "Username"}}<input name="username" autocomplete="username" required maxlength="64" autofocus></label>
  <label class="field">{{t "Password"}}<input type="password" name="password" autocomplete="current-password" required maxlength="1024"></label>
  <button class="btn primary wide">{{t "Log in"}}</button>
</form>
<p class="hint center">{{th "Accounts are created on the server:<br><code>formd user add &lt;username&gt;</code>"}}</p>
{{end}}
