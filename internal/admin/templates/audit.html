{{define "content"}}
<table>
<thead><tr><th>Czas</th><th>Użytkownik</th><th>IP</th><th>Akcja</th><th>Szczegóły</th></tr></thead>
<tbody>
{{range .Data}}<tr><td>{{time .TS}}</td><td>{{.Username}}</td><td>{{.IP}}</td><td>{{.Action}}</td><td class="muted">{{.Detail}}</td></tr>
{{else}}<tr><td colspan="5">Pusto.</td></tr>{{end}}
</tbody>
</table>
{{end}}
