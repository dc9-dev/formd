{{define "content"}}
<div class="panel flush">
<table>
<thead><tr><th>{{t "Time"}}</th><th>{{t "User"}}</th><th>{{t "Action"}}</th><th>{{t "Details"}}</th><th>IP</th></tr></thead>
<tbody>
{{range .Data}}<tr><td class="nowrap">{{time .TS}}</td><td>{{.Username}}</td><td><span class="tag {{if or (eq .Action "login_failed") (eq .Action "csrf_failed") (eq .Action "login_throttled")}}red{{end}}">{{.Action}}</span></td><td class="muted">{{.Detail}}</td><td class="muted">{{.IP}}</td></tr>
{{else}}<tr><td colspan="5" class="muted center">{{t "Nothing here."}}</td></tr>{{end}}
</tbody>
</table>
</div>
{{end}}
