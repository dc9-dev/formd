{{define "content"}}
<form method="post" action="/account" class="panel narrow stack">
  <input type="hidden" name="csrf" value="{{.Session.CSRF}}">
  <h2>{{t "Change password"}}</h2>
  <label class="field">{{t "Current password"}}<input type="password" name="current" autocomplete="current-password" required></label>
  <label class="field">{{t "New password"}}<small>{{t "At least 12 characters."}}</small><input type="password" name="new" autocomplete="new-password" required minlength="12"></label>
  <label class="field">{{t "Repeat the new password"}}<input type="password" name="confirm" autocomplete="new-password" required minlength="12"></label>
  <p class="hint">{{t "Changing the password logs out every session."}}</p>
  <div><button class="btn primary">{{t "Save new password"}}</button></div>
</form>
{{end}}
