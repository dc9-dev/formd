{{define "crumbs"}}<a class="crumb" href="/">← {{t "Forms"}}</a>{{end}}
{{define "content"}}
<form method="post" action="/forms/new" class="panel narrow stack">
  <input type="hidden" name="csrf" value="{{.Session.CSRF}}">
  <label class="field">{{t "ID"}}<small>{{th "It appears in the address <code>/f/…</code>. Lowercase letters, digits, - and _."}}</small>
    <input name="id" value="{{index .Data "id"}}" pattern="[a-z0-9][a-z0-9_\-]{0,63}" required maxlength="64" placeholder="{{t "contact"}}"></label>
  <label class="field">{{t "Form name"}}<input name="title" value="{{index .Data "title"}}" maxlength="200" placeholder="{{t "Contact form"}}"></label>
  <label class="field">{{t "Site (origin)"}}<small>{{t "The address of the site the form will be sent from."}}</small>
    <input name="origin" value="{{index .Data "origin"}}" required placeholder="https://example.com"></label>
  <p class="hint">{{t "The form is created disabled, with safe defaults: a proof-of-work challenge, limits and a honeypot."}}</p>
  <div><button class="btn primary">{{t "Create form"}}</button></div>
</form>
{{end}}
