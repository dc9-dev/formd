# Fragment server{} strony statycznej. Wystawiamy TYLKO /f/ — panel admina
# (port 8026) nigdy nie jest proxowany.

# W kontekście http{}:
# limit_req_zone $binary_remote_addr zone=formd:10m rate=10r/m;

location /f/ {
    limit_req zone=formd burst=10 nodelay;
    limit_req_status 429;
    client_max_body_size 64k;

    proxy_pass http://127.0.0.1:8025;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;   # nadpisujemy, nie doklejamy
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
}
