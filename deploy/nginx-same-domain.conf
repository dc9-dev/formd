# Wariant A (zalecany): formularz na TEJ SAMEJ domenie co strona.
#
#   przeglądarka ── HTTPS POST https://example.com/f/kontakt ──▶ nginx (TLS) ──▶ http://127.0.0.1:8025
#
# Strona i formularz mają ten sam origin i ten sam certyfikat: brak CORS,
# brak mixed content. formd sam nie obsługuje TLS i słucha tylko lokalnie —
# szyfrowanie zapewnia nginx.
#
# Plik do /etc/nginx/conf.d/ (tam jest kontekst http{}). Certyfikat:
#   certbot --nginx -d example.com -d www.example.com
# W formd.env: ALLOWED_IPS=127.0.0.1, TRUSTED_PROXIES=127.0.0.1
# W panelu: dozwolony origin https://example.com

# Strefa limitu może być zdefiniowana tylko raz w całym nginx — jeśli używasz
# formd dla kilku domen, zostaw tę linię tylko w jednym pliku.
limit_req_zone $binary_remote_addr zone=formd:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;
    return 301 https://example.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                      # nginx < 1.25.1: usuń i dopisz "http2" do listen
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Strona statyczna
    root  /var/www/example.com;
    index index.html;
    location / {
        try_files $uri $uri/ =404;
    }

    # Formularze -> formd. Wystawiamy TYLKO /f/; panel (8026) nigdy nie jest proxowany.
    location /f/ {
        limit_req zone=formd burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 64k;

        proxy_pass http://127.0.0.1:8025;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;   # nadpisujemy, nie doklejamy
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
}
