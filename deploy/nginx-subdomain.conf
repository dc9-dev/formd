# Wariant B: osobna subdomena na formularze — gdy strona jest hostowana gdzie
# indziej (GitHub Pages, Netlify, S3/CloudFront) albo na innym serwerze.
#
#   https://example.com (strona)  ── HTTPS POST https://forms.example.com/f/kontakt ──▶ nginx (TLS) ──▶ 127.0.0.1:8025
#
# Wymagania:
#   1. Rekord DNS forms.example.com -> ten serwer.
#   2. Certyfikat:  certbot --nginx -d forms.example.com
#   3. W panelu: dozwolony origin https://example.com (strona, NIE subdomena formularzy).
#      formd odpowie nagłówkami CORS tylko dla tego originu.
#   4. Na stronie PEŁNE adresy HTTPS:
#        <form action="https://forms.example.com/f/kontakt" method="post" data-formd>
#        <script src="https://forms.example.com/f/formd.js" defer></script>
#      Jeśli strona ma CSP, dopisz forms.example.com do script-src, connect-src i form-action.

# Strefa limitu może być zdefiniowana tylko raz w całym nginx — jeśli używasz
# formd dla kilku domen, zostaw tę linię tylko w jednym pliku.
limit_req_zone $binary_remote_addr zone=formd:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name forms.example.com;
    return 301 https://forms.example.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                      # nginx < 1.25.1: usuń i dopisz "http2" do listen
    server_name forms.example.com;

    ssl_certificate     /etc/letsencrypt/live/forms.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forms.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location /f/ {
        limit_req zone=formd burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 64k;

        proxy_pass http://127.0.0.1:8025;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # Nic poza /f/ — w szczególności panel admina.
    location / {
        return 404;
    }
}
