<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kontakt</title>
<style>
  body{font:16px/1.5 system-ui,sans-serif;max-width:34rem;margin:3rem auto;padding:0 1rem}
  label{display:block;margin:.8rem 0}
  input,textarea{display:block;width:100%;font:inherit;padding:.5rem;margin-top:.2rem}
  .hp{position:absolute;left:-10000px}
  [data-formd-status][data-state=error]{color:#b91c1c;white-space:pre-line}
</style>
</head>
<body>
<h1>Napisz do nas</h1>

<!-- /f/ jest przekazywane przez nginx/Caddy do formd na 127.0.0.1:8025 -->
<form action="/f/kontakt" method="post" data-formd="ajax">
  <label>Imię <input name="name" maxlength="200" required></label>
  <label>E-mail <input type="email" name="email" maxlength="254" required></label>
  <label>Wiadomość <textarea name="message" rows="6" maxlength="5000" required></textarea></label>

  <!-- honeypot: ukryty CSS-em, ludzie go nie widzą, boty wypełniają -->
  <div class="hp" aria-hidden="true"><input name="website" tabindex="-1" autocomplete="off"></div>

  <button type="submit">Wyślij</button>
  <p data-formd-status role="status"></p>
</form>

<script src="/f/formd.js" defer></script>
</body>
</html>
